services:
  documind:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./vector_store:/app/vector_store
      - ./logs:/app/logs
    depends_on:
      - qdrant
    restart: unless-stopped

  # Optional: local Qdrant instance. Set VECTOR_DB=qdrant and
  # QDRANT_URL=http://qdrant:6333 in your .env to use it instead of FAISS.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
